name: Test custom desktop plugin

on:
  push:
    branches: ["feat/native-session-delete"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check index.mjs
      - run: node --check session-delete.host.mjs
      - run: node --check session-delete.client.js
      - run: npm test
